<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Camellia | Студия фотографии</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Times New Roman', serif; background: #FFFBF6; color: #41322c; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #5c3f32; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #5C4033; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #D2B48C; border-radius: 8px; font-size: 1rem; }
        button { width: 100%; background: #5c3f32; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
        button:hover { background: #4e3a2c; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .creds-box { background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; display: none; }
        .btn-link { display: inline-block; background: #5c3f32; color: white; padding: 12px 20px; text-decoration: none; border-radius: 8px; margin-top: 15px; text-align: center; }
        .login-link { text-align: center; margin-top: 20px; }
        .login-link a { color: #5c3f32; }
    </style>
</head>
<body>
<div class="container">
    <h1> Camellia Studio</h1>
    <h3 style="text-align:center; margin-bottom:20px;">Запись на фотосессию</h3>
    
    <div id="formMessage" class="message"></div>
    <div id="credsBox" class="creds-box"></div>
    
    <form id="bookingForm">
        <div class="form-group">
            <label>Ваше имя *</label>
            <input type="text" id="fullname" required>
        </div>
        <div class="form-group">
            <label>Телефон *</label>
            <input type="tel" id="phone" required>
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>Тип фотосессии</label>
            <select id="session_type">
                <option value="">Выберите...</option>
                <option>Индивидуальный портрет</option>
                <option>Семейная</option>
                <option>Love-story</option>
                <option>Детская</option>
                <option>Свадебная</option>
            </select>
        </div>
        <div class="form-group">
            <label>Место съемки</label>
            <select id="location_type">
                <option value="">Выберите...</option>
                <option>В студии</option>
                <option>Выездная съемка</option>
            </select>
        </div>
        <div class="form-group">
            <label>Предпочитаемая студия</label>
            <select id="preferred_studio">
                <option value="">Не важно</option>
                <option>Лофт-студия</option>
                <option>Классическая студия</option>
                <option>Студия с естественным светом</option>
            </select>
        </div>
        <div class="form-group">
            <label>Предпочтительная дата</label>
            <input type="date" id="preferred_date">
        </div>
        <div class="form-group">
            <label>Пожелания</label>
            <textarea id="message" rows="3"></textarea>
        </div>
        <button type="submit" id="submitBtn">Отправить заявку</button>
    </form>
    
    <div class="login-link">
        <a href="profile.html"> Уже есть логин и пароль? Войти в личный кабинет</a>
    </div>
</div>

<script>
const form = document.getElementById('bookingForm');
const messageDiv = document.getElementById('formMessage');
const credsBox = document.getElementById('credsBox');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = {
        fullname: document.getElementById('fullname').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        session_type: document.getElementById('session_type').value,
        location_type: document.getElementById('location_type').value,
        preferred_studio: document.getElementById('preferred_studio').value,
        preferred_date: document.getElementById('preferred_date').value,
        message: document.getElementById('message').value
    };
    
    if (!formData.fullname || !formData.phone || !formData.email) {
        showMessage('error', ' Заполните имя, телефон и email!');
        return;
    }
    
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = ' Отправка...';
    
    try {
        const response = await fetch('api.php/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        
        if (result.success) {
            // Показываем логин и пароль
            credsBox.innerHTML = `
                <strong> Заявка отправлена!</strong><br><br>
                 <strong>СОХРАНИТЕ ЭТИ ДАННЫЕ:</strong><br>
                 Логин: <code style="background:#fff;padding:4px 8px;border-radius:4px;font-size:1.1rem;">${result.login}</code><br>
                 Пароль: <code style="background:#fff;padding:4px 8px;border-radius:4px;font-size:1.1rem;">${result.password}</code><br><br>
                <a href="profile.html" class="btn-link" style="color:white; text-decoration:none;"> Войти в личный кабинет </a>
            `;
            credsBox.style.display = 'block';
            showMessage('success', ' Заявка успешно отправлена!');
            form.reset();
        } else {
            showMessage('error', ' Ошибка: ' + JSON.stringify(result.errors || result));
        }
    } catch (error) {
        console.error('Error:', error);
        showMessage('error', ' Ошибка соединения с сервером. Убедитесь, что файл api.php находится в той же папке.');
    } finally {
        btn.disabled = false;
        btn.textContent = '📩 Отправить заявку';
    }
});

function showMessage(type, text) {
    messageDiv.innerHTML = text;
    messageDiv.className = `message ${type}`;
    setTimeout(() => {
        messageDiv.style.display = 'none';
        messageDiv.className = 'message';
    }, 8000);
}
</script>
</body>
</html>
