<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет | Camellia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Times New Roman', serif; background: #FFFBF6; color: #41322c; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #5c3f32; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #5C4033; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #D2B48C; border-radius: 8px; font-size: 1rem; }
        button { width: 100%; background: #5c3f32; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        button:hover { background: #4e3a2c; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .login-box { background: #f5f5f5; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .login-box input { margin-bottom: 15px; }
        .logout { text-align: right; margin-bottom: 20px; }
        .logout a { color: #5c3f32; text-decoration: none; }
        .login-info { background: #F5E9DB; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .login-info code { background: white; padding: 4px 8px; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📸 Личный кабинет</h1>
    
    <div id="loginPanel">
        <div class="login-box">
            <h3>🔐 Вход в личный кабинет</h3>
            <div id="loginMessage" class="message"></div>
            <input type="text" id="loginInput" placeholder="Логин">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button onclick="login()">Войти</button>
        </div>
    </div>
    
    <div id="profilePanel" style="display: none;">
        <div class="logout">
            <a href="#" onclick="logout()">🚪 Выйти</a>
        </div>
        <div class="login-info">
            🔐 Ваш логин: <code id="userLogin"></code>
        </div>
        <div id="profileMessage" class="message"></div>
        
        <form id="editForm">
            <div class="form-group">
                <label>ФИО *</label>
                <input type="text" id="fullname" required>
            </div>
            <div class="form-group">
                <label>Телефон *</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Тип фотосессии</label>
                <select id="session_type">
                    <option value="">Выберите...</option>
                    <option>Индивидуальный портрет</option>
                    <option>Семейная</option>
                    <option>Love-story</option>
                    <option>Детская</option>
                    <option>Свадебная</option>
                </select>
            </div>
            <div class="form-group">
                <label>Место съемки</label>
                <select id="location_type">
                    <option value="">Выберите...</option>
                    <option>В студии</option>
                    <option>Выездная съемка</option>
                </select>
            </div>
            <div class="form-group">
                <label>Предпочитаемая студия</label>
                <select id="preferred_studio">
                    <option value="">Не важно</option>
                    <option>Лофт-студия</option>
                    <option>Классическая студия</option>
                    <option>Студия с естественным светом</option>
                </select>
            </div>
            <div class="form-group">
                <label>Предпочтительная дата</label>
                <input type="date" id="preferred_date">
            </div>
            <div class="form-group">
                <label>Пожелания</label>
                <textarea id="message" rows="3"></textarea>
            </div>
            <button type="button" onclick="updateProfile()">💾 Сохранить изменения</button>
        </form>
    </div>
</div>

<script>
let currentUser = null;

async function login() {
    const login = document.getElementById('loginInput').value;
    const password = document.getElementById('passwordInput').value;
    const msgDiv = document.getElementById('loginMessage');
    
    if (!login || !password) {
        msgDiv.innerHTML = '❌ Введите логин и пароль';
        msgDiv.className = 'message error';
        return;
    }
    
    msgDiv.innerHTML = '⏳ Проверка...';
    msgDiv.className = 'message';
    
    try {
        const response = await fetch('api.php/profile', {
            method: 'GET',
            headers: {
                'Authorization': 'Basic ' + btoa(login + ':' + password)
            }
        });
        
        const result = await response.json();
        
        if (result.success) {
            currentUser = result.user;
            sessionStorage.setItem('camellia_auth', btoa(login + ':' + password));
            showProfileForm();
        } else {
            msgDiv.innerHTML = '❌ Неверный логин или пароль';
            msgDiv.className = 'message error';
        }
    } catch (error) {
        msgDiv.innerHTML = '❌ Ошибка соединения. Проверьте, что api.php в той же папке.';
        msgDiv.className = 'message error';
    }
}

function showProfileForm() {
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('profilePanel').style.display = 'block';
    document.getElementById('userLogin').textContent = currentUser.login;
    
    document.getElementById('fullname').value = currentUser.fullname || '';
    document.getElementById('phone').value = currentUser.phone || '';
    document.getElementById('email').value = currentUser.email || '';
    document.getElementById('session_type').value = currentUser.session_type || '';
    document.getElementById('location_type').value = currentUser.location_type || '';
    document.getElementById('preferred_studio').value = currentUser.preferred_studio || '';
    document.getElementById('preferred_date').value = currentUser.preferred_date || '';
    document.getElementById('message').value = currentUser.message || '';
}

async function updateProfile() {
    const auth = sessionStorage.getItem('camellia_auth');
    if (!auth) {
        logout();
        return;
    }
    
    const updatedData = {
        fullname: document.getElementById('fullname').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        session_type: document.getElementById('session_type').value,
        location_type: document.getElementById('location_type').value,
        preferred_studio: document.getElementById('preferred_studio').value,
        preferred_date: document.getElementById('preferred_date').value,
        message: document.getElementById('message').value
    };
    
    const msgDiv = document.getElementById('profileMessage');
    msgDiv.innerHTML = '⏳ Сохранение...';
    msgDiv.className = 'message';
    
    try {
        const response = await fetch('api.php/profile', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Basic ' + auth
            },
            body: JSON.stringify(updatedData)
        });
        
        const result = await response.json();
        
        if (result.success) {
            currentUser = result.user;
            msgDiv.innerHTML = '✅ Данные успешно обновлены!';
            msgDiv.className = 'message success';
            setTimeout(() => msgDiv.style.display = 'none', 3000);
        } else {
            msgDiv.innerHTML = '❌ Ошибка: ' + (result.error || 'Неизвестная ошибка');
            msgDiv.className = 'message error';
        }
    } catch (error) {
        msgDiv.innerHTML = '❌ Ошибка соединения с сервером';
        msgDiv.className = 'message error';
    }
}

function logout() {
    sessionStorage.removeItem('camellia_auth');
    currentUser = null;
    document.getElementById('loginPanel').style.display = 'block';
    document.getElementById('profilePanel').style.display = 'none';
    document.getElementById('loginInput').value = '';
    document.getElementById('passwordInput').value = '';
    document.getElementById('loginMessage').innerHTML = '';
}

// Автоматический вход, если логин передан в URL
const urlParams = new URLSearchParams(window.location.search);
const loginFromUrl = urlParams.get('login');
if (loginFromUrl) {
    document.getElementById('loginInput').value = loginFromUrl;
}

// Проверяем сохранённую сессию
if (sessionStorage.getItem('camellia_auth')) {
    login();
}
</script>
</body>
</html>
